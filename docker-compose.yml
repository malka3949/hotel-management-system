services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotel_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.3-alpine3.21
    container_name: hotel_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - hotel_internal
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hotel_backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    networks:
      - hotel_internal
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CSRF_SECRET: ${CSRF_SECRET}
      REFRESH_TOKEN_HMAC_KEY: ${REFRESH_TOKEN_HMAC_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      N8N_BASE_URL: http://n8n:5678
      RESEND_API_KEY: re_3WD3vmvB_5P76Ly3am3zfKheojS71YnDT
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: hotel_n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    networks:
      - hotel_internal
    environment:
      N8N_ENCRYPTION_KEY: rmc3TEszEbar6xpXhnt1KaXt6G+qNQr9
      N8N_USER_MANAGEMENT_DISABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'false'
      GENERIC_TIMEZONE: Asia/Jerusalem
      TZ: Asia/Jerusalem
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      N8N_RUNNERS_ENABLED: 'false'
    volumes:
      - /home/runner/.n8n:/home/node/.n8n
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:5678/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hotel_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    networks:
      - hotel_internal
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

networks:
  hotel_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
