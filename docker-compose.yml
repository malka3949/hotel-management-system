services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_postgres
    restart: unless-stopped
    expose:
      - '5432'
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotel_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.3-alpine3.21
    container_name: hotel_redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    volumes:
      - redis_data:/data
    networks:
      - hotel_internal
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  autoheal:
    image: willfarrell/autoheal@sha256:0db22d575c4ffdb3c62dc3f449c39cb6ca6c510ec2dc06116839898cd17c6061
    container_name: hotel_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hotel_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hotel_backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    labels:
      autoheal: 'true'
    ports:
      - '3001:3001'
    networks:
      - hotel_internal
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:3001/api/health | grep -q "\"status\":\"ok\"" || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CSRF_SECRET: ${CSRF_SECRET}
      REFRESH_TOKEN_HMAC_KEY: ${REFRESH_TOKEN_HMAC_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backend_dist:/app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy

  n8n:
    image: n8nio/n8n@sha256:d53243d06c7f7de81910ac922ff55ed4b58c9c3c761d7f2f8443d0567990def3
    container_name: hotel_n8n
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    expose:
      - '5678'
    networks:
      - hotel_internal
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_DISABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'false'
      GENERIC_TIMEZONE: Asia/Jerusalem
      TZ: Asia/Jerusalem
      N8N_RUNNERS_ENABLED: 'false'
      N8N_SECURE_COOKIE: 'false'
    volumes:
      - /home/runner/.n8n:/home/node/.n8n
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:5678/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hotel_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - '3000:3000'
    networks:
      - hotel_internal
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

networks:
  hotel_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_dist:
