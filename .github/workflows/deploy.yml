name: Deploy

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging (develop)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render staging deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"

  approve-production:
    name: Await production approval (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved
        run: echo "Production deployment approved"

  deploy-production:
    name: Deploy to Production (main)
    needs: approve-production
    runs-on: ubuntu-latest
    steps:
      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          npx prisma migrate deploy
        working-directory: backend

      - name: Trigger Render production deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
