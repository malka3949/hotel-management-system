databases:
  - name: hotel-management-db
    databaseName: hotel_management
    user: hotel_admin
    plan: starter
    region: frankfurt

services:
  - type: keyvalue
    name: hotel-management-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: hotel-management-backend
    region: frankfurt
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hotel-management-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: TRANZILA_TERMINAL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PORT
        value: "3001"
