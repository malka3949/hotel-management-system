# nginx reverse proxy — hotel management system
# Dev: HTTP on port 80 only.
# Prod: comment out the HTTP server block, uncomment the HTTPS block below,
#       set your domain in server_name, and obtain certs with:
#         docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d your-domain.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP ──────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # ACME challenge for Let's Encrypt (needed even in dev to prime for prod)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # WebSocket — socket.io (backend real-time)
    location /socket.io/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # All other traffic → Next.js (which internally proxies /api/* to backend)
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── HTTPS (production) ────────────────────────────────────────────────────────
# Steps to enable:
#   1. Replace "your-domain.com" with your actual domain in both server_name lines
